create_release_tag:
  stage: release
  image: python:3.8
  tags:
    - build
  before_script: []
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "release/v2.x" && $CI_PIPELINE_SOURCE == "push"
  script:
    - |
      set -e
      VER=$(python3 -c "import re,sys;print(re.search(r'^version:\s*\"?([^\"\s]+)\"?', open('idf_component.yml').read(), re.M).group(1))")
      test -n "${VER}"
      git remote set-url origin "https://oauth2:${GITLAB_TOKEN_STAGING_TO_MAIN}@gitlab.espressif.cn:6688/app-frameworks/esp_hosted_mcu.git"
      # tags are not fetched at the default git depth, so ask the remote
      if git ls-remote --tags --exit-code origin "refs/tags/v${VER}" >/dev/null 2>&1; then
        echo "v${VER} already released"
        exit 0
      fi
      git config user.name "$GITLAB_USER_NAME"
      git config user.email "$GITLAB_USER_EMAIL"
      git tag -a "v${VER}" "$CI_COMMIT_SHA" -m "ESP-Hosted-MCU ${VER}"
      # A tag pipeline would resolve the ci/actions/common include with the
      # bot token, which cannot read that project, so it fails before any
      # rule applies. Nothing here runs on tags.
      git push -o ci.skip origin "v${VER}"

# Proves the GITLAB_TO_GITHUB_DEPLOY_KEY variable can push to GitHub from a
# runner. Pushes a probe tag that is created only in this job and never on
# GitLab, so the push mirror cannot be the thing that delivered it: absent at
# the source, present at the destination means the key did it. The name does
# not match v2.*, so the registry workflow ignores it.
github_deploy_key_probe:
  stage: release
  image: alpine:3.20
  tags:
    - build
  before_script: []
  dependencies: []
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_BRANCH == "release/v2.x" && $CI_PIPELINE_SOURCE == "push"
      allow_failure: true
  script:
    - apk add --no-cache git openssh-client
    - |
      # The key travels base64 encoded so it holds no whitespace, which is what
      # a masked variable requires. A File variable keeps the PEM verbatim and
      # loses the trailing newline, which openssh rejects with
      # "error in libcrypto".
      echo "$GH_DEPLOY_KEY_VAR" | base64 -d > /tmp/deploy_key
      chmod 600 /tmp/deploy_key
      head -1 /tmp/deploy_key
      tail -1 /tmp/deploy_key
    - export GIT_SSH_COMMAND="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new"
    - GH=git@github.com:espressif/esp-hosted-mcu.git
    - PROBE="ci-deploy-probe-${CI_PIPELINE_ID}"
    - echo "=== BEFORE — expect no output ==="
    - git ls-remote "$GH" "refs/tags/${PROBE}"
    - git init -q /tmp/probe
    - cd /tmp/probe
    - git remote add gh "$GH"
    # Tag a commit GitHub already has, so the push carries the ref alone and
    # transfers no objects.
    - git fetch -q --depth 1 gh refs/heads/release/v2.x
    - git tag "$PROBE" FETCH_HEAD
    - echo "=== PUSH — expect '* [new tag]' ==="
    - git push gh "refs/tags/${PROBE}"
    - echo "=== AFTER — expect the tag ==="
    - git ls-remote "$GH" "refs/tags/${PROBE}"
    - echo "=== removing the probe tag again ==="
    - git push gh --delete "refs/tags/${PROBE}"
