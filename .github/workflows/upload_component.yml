name: Push component to https://components.espressif.com
# 2.x is support only. main now carries 3.x, so publishing from a branch would
# either never fire or fire from the wrong line. A 2.x release is a deliberate tag.
on:
  push:
    tags:
      - 'v2.*'

jobs:
  upload_components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name : Copy common dir into slave
        run: cp -r common slave/main/

      - name: Upload component to the component registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "esp_hosted:."
          namespace: "espressif"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
