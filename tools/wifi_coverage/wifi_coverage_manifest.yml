#
# Every IDF Wi-Fi struct and API, and what ESP-Hosted does with it.
# check_wifi_coverage.py fails when an IDF ref has a struct, a field of a
# mapped struct, or an API that is neither defined by hosted nor classified here.
#
# headers: classifies every struct and API of one header that has no own entry.
# apis:    classifies one API that hosted does not define. An API hosted defines
#          is "supported" (or "stub" when it only returns ESP_ERR_NOT_SUPPORTED)
#          without an entry; an entry other than local on such an API fails as STALE.
#   {local: reason}        works on the host without RPC
#   {unsupported: reason}  hosted does not offer it
#   {gap: reason}          should work, does not yet; reported, does not fail
#   {skip: reason}         never needed on the host, by design
#
# structs:
# A struct is either mapped field by field (proto + fields), or marked as a
# whole with one of:
#   {unsupported: reason}      hosted does not offer the API or event
#   {skip: reason}             never carried, by design
#   {gap: reason}              should be carried, is not yet; reported, does not fail
# Struct keys for field-by-field structs:
#   proto:   rpc_v2.proto message for fields marked "carried"
#   since:   first IDF version that has the struct; before it, absence is fine
#   aliases: older names of the struct
# Field values:
#   carried                    proto field <proto>.<field name>
#   {proto: msg.field}         field travels in another proto field
#   {proto: ..., bit: NAME}    packed into a bitmask; NAME must exist in the CP
#                              bitmask header, EH_HOST_NAME in the host one
#   {skip: reason}             never carried, by design
#   {gap: reason}              not carried yet; reported, does not fail
# Reserved fields (reserved, reserved1, he_reserved, ...) and unnamed padding
# are ignored. A field whose type is another struct listed here is one entry;
# that struct is checked on its own.

headers:
  esp_wifi_default.h: {local: IDF netif helpers run on the host (esp_wifi builds wifi_default.c without local Wi-Fi)}
  esp_wifi_netif.h: {local: IDF netif helpers run on the host (esp_wifi builds wifi_netif.c without local Wi-Fi)}
  esp_wifi_ap_get_sta_list.h: {local: IDF netif helpers run on the host (esp_wifi builds wifi_default_ap.c without local Wi-Fi)}
  smartconfig_ack.h: {unsupported: SmartConfig is not implemented in hosted}
  esp_wpa2.h: {unsupported: deprecated WPA2-Enterprise API; hosted provides esp_eap_client_* instead}
  esp_now.h: {unsupported: ESP-NOW is not implemented in hosted}
  esp_smartconfig.h: {unsupported: SmartConfig is not implemented in hosted}
  esp_mesh.h: {unsupported: ESP-MESH is not implemented in hosted}
  esp_mesh_internal.h: {unsupported: ESP-MESH is not implemented in hosted}
  esp_wps.h: {unsupported: WPS is not implemented in hosted}
  esp_wnm.h: {unsupported: 802.11v WNM API is not implemented in hosted}
  esp_rrm.h: {unsupported: 802.11k RRM API is not implemented in hosted}
  esp_mbo.h: {unsupported: MBO API is not implemented in hosted}
  esp_supplicant_utils.h: {unsupported: supplicant utility is not built on the host}
  esp_wpa.h: {skip: the supplicant runs on the CP}

